[package]
name = "battery-edge-client"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "battery-edge-client"
path = "src/main.rs"

[dependencies]
rumqttc   = "0.24"
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
tokio     = { version = "1", features = ["full"] }
rand      = "0.8"
log       = "0.4"
env_logger = "0.11"
uuid      = { version = "1", features = ["v4"] }

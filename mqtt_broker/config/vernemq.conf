## VerneMQ configuration optimised for high-concurrency IoT (5 000+ clients)

## ── Listener ports ────────────────────────────────────────────────────────────
listener.tcp.default = 0.0.0.0:1883
listener.ws.default  = 0.0.0.0:8080

## Allow anonymous connections in the development / simulation environment.
allow_anonymous = on

## ── Connection limits ─────────────────────────────────────────────────────────
max_client_id_size   = 100
max_connections      = 100000

## ── Per-client message queue ─────────────────────────────────────────────────
max_offline_messages = 1000
max_online_messages  = 1000

## ── Publish / subscribe limits ───────────────────────────────────────────────
max_message_size     = 65536
# Maximum number of QoS 1/2 messages in flight per client.
max_inflight_messages = 100

## ── Persistence ──────────────────────────────────────────────────────────────
# Use the built-in leveldb store for session / retained message persistence.
leveldb.path = /var/lib/vernemq/db

## ── Cluster (single-node dev setup) ──────────────────────────────────────────
nodename = vpp@127.0.0.1

## ── Logging ──────────────────────────────────────────────────────────────────
log.console          = file
log.console.file     = /var/log/vernemq/console.log
log.error.file       = /var/log/vernemq/error.log
log.crash            = on
log.crash.file       = /var/log/vernemq/crash.log
log.level            = info
